- hosts: all
  become: true

  tasks:
    - name: Install Docker packages
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: yes

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create app directory
      file:
        path: /home/ubuntu/app
        state: directory

    - name: Clone repository
      git:
        repo: https://github.com/Bielin37/devops.git
        dest: /home/ubuntu/app
        version: master

    - name: Run containers
      shell: docker-compose -f ./docker-compose.prod.yml up -d
      args:
        chdir: /home/ubuntu/app

    - name: Migrate Prisma
      shell: docker exec app_api_1 yarn rw prisma migrate deploy
      args:
        chdir: /home/ubuntu/app
