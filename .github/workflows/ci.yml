name: Redwood CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://redwood:redwood@localhost:5432/redwood

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: redwood
          POSTGRES_PASSWORD: redwood
          POSTGRES_DB: redwood
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U redwood"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install deps
        run: yarn install

      - name: Generate Prisma client
        run: yarn rw prisma generate

      - name: Run migrations
        run: yarn rw prisma migrate deploy

      - name: Build app
        run: yarn rw build

      - name: Show Postgres logs
        run: docker logs $(docker ps -q --filter ancestor=postgres:16-bookworm)

      - name: List containers
        run: docker ps

      - name: Test DB connection
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql postgresql://redwood:redwood@localhost:5432/redwood -c '\l'

      - name: Run tests
        run: echo $DATABASE_URL & yarn rw test
        env:
          DATABASE_URL: postgresql://redwood:redwood@localhost:5432/redwood
