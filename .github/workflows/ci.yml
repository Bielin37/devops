name: Redwood CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    #services:
      #postgres:
      #  image: postgres:16-bookworm
      #  env:
      #    POSTGRES_USER: redwood
