      #  options: >-
      #    --health-cmd="pg_isready -U redwood"
      #    --health-interval=10s
      #    --health-timeout=5s
      #    --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      #- name: Install deps
      #  run: yarn install

      #- name: Generate Prisma client
      #  run: yarn rw prisma generate

      #- name: Run migrations
      #  run: yarn rw prisma migrate deploy
      #  env:
      #    DATABASE_URL: ${{ secrets.DATABASE_URL }}

      #- name: Project lint
      #  run: yarn rw lint

      #- name: Project types check
      #  run: yarn rw type-check

      #- name: Build app
      #  run: yarn rw build
      #  env:
      #    DATABASE_URL: ${{ secrets.DATABASE_URL }}

      #- name: Run tests
      #  run: yarn rw test
      #  env:
      #    TEST_DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Terraform
        run: |
          git clone https://github.com/hashicorp/terraform
          cd terraform
          go install
          mv ~/Downloads/terraform /usr/local/bin/
          terraform -help

      - name: Deploy to AWS
        run: |
          cd devops
          chmod +x deploy.sh
          ./deploy.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
