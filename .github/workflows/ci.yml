name: Redwood CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn rw prisma generate

      - name: Run migrations
        run: yarn rw prisma migrate dev
        env:
          DATABASE_URL: file:./dev.db

      - name: Build app
        run: yarn rw build

      - name: Run tests
        run: yarn rw test
